#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4G
kotlin.native.ignoreDisabledTargets=true
#Gradle
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# A default that is a snapshot on purpose: a build with no -PVERSION must not be able to produce
# something that looks like a release. CI passes `0.2.<run number>` as ORG_GRADLE_PROJECT_VERSION,
# which `sborka.base` sets on the PROJECT where the archive tasks read it.
#
# THE HEAD IS WRITTEN TWICE — here and in `publish-agent.yaml` — and the two have already drifted
# once. This file said the scheme was `-PVERSION` while the workflow still exported
# ORG_GRADLE_PROJECT_BUILD_NUMBER, a name nothing has read since `libVersion()` was deleted; the
# publish then fell back to this default and put `0.1.0-SNAPSHOT` on the server beside the numbered
# releases. Green job, published artefact, wrong version. Both places move together.
version=0.2.0-SNAPSHOT

# WHAT THIS REPOSITORY TELLS THE SHARED CONVENTIONS.
sborka.group=io.github.youndie.metrik
sborka.repository=youndie/metrik
sborka.description=Monitoring for Ktor services: a Kotlin/Native server, a multiplatform agent and a Compose dashboard.
sborka.inceptionYear=2026

# 25 for both. Nothing consumes the agent that is older — the services it watches live in this same
# portfolio and run on 25 — and the floor has to be said out loud either way, or a consumer resolves
# the library, compiles against it and meets UnsupportedClassVersionError at class loading.
sborka.jvmToolchain=25
sborka.jvmFloor=25

# PREFER_SETTINGS rather than the default refusal, and not by preference: `composeApp` has a wasmJs
# target, and the Kotlin plugin declares ivy repositories for the Node, Yarn and Binaryen
# distributions ON THE PROJECT. FAIL_ON_PROJECT_REPOS then refuses the build over repositories nobody
# here wrote — "added by unknown code". Settings repositories still win; the mode stops shouting.
sborka.repositoriesMode=PREFER_SETTINGS

# OFF, AND IT SHOULD NOT STAY OFF. `explicitApi()` is right for a published library and sborka turns
# it on by default; here it costs 684 errors across 7 files in `:shared` alone, before the agent is
# even reached. Spelling out a visibility and a return type on every public declaration is a change
# to the LIBRARY, not to how it is built — folded into the migration it would bury whatever the
# migration itself breaks in a diff nobody can read.
# Tracked separately: youndie/metrik#9.
