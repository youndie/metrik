[versions]
# The shared build conventions. One number: every sborka plugin below takes its version from here,
# and so does the compiler — the `wip` catalog this release publishes carries `kotlin` and the
# Compose Multiplatform version that moves with it, so neither has a version in this file to drift
# from the rest of the portfolio.
sborka = "0.4.0.111"
# kore: жизненный цикл серверного бинарника — упорядоченная остановка, три пробы, /version.
# Одно число на библиотеки и на Gradle-плагин идентичности сборки: они публикуются вместе, и
# плагин одной версии с библиотекой другой сойдётся при компиляции и разойдётся в объекте,
# который генерирует.
kore = "0.1.4"
# kore-mcp — охраняемый MCP-эндпоинт из той же библиотеки, но своим числом, и это намеренно. Поднять
# весь kore до 0.1.14 значит перевести старт на `startForKore()`: `EngineDrain` там отказывается
# строиться рядом с включённым shutdown hook Ktor, а `main` стартует обычным `start()`. Это отдельная
# миграция жизненного цикла, а не часть переезда эндпоинта. kore-mcp от kore-core не зависит, так что
# два числа рядом ничего не делят; свести их в одно — вместе с той миграцией.
koreMcp = "0.1.14"
kotlinxCoroutines = "1.11.0"
kotlinxSerializationJson = "1.11.0"
kotlinxDatetime = "0.8.0"
okio = "3.18.2"
sqlx4k = "1.13.1"
ktlintPlugin = "14.2.0"
# renovate: datasource=maven depName=com.pinterest.ktlint:ktlint-cli
ktlint = "1.8.0"
materialKolor = "5.0.1"
androidxLifecycle = "2.11.0"
navigation3Ui = "1.1.1"
navigation3Browser = "1.1.0"
koin = "4.2.2"
mcpSdk = "0.15.0"
mosaic = "0.18.0"

[libraries]
kore-core = { module = "io.github.youndie:kore-core", version.ref = "kore" }
kore-ktor = { module = "io.github.youndie:kore-ktor", version.ref = "kore" }
kore-mcp = { module = "io.github.youndie:kore-mcp", version.ref = "koreMcp" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }

okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
sqlx4k-sqlite = { module = "io.github.smyrgeorge:sqlx4k-sqlite", version.ref = "sqlx4k" }
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }

androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3Ui" }
androidx-lifecycle-viewmodelNavigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidxLifecycle" }
navigation3-browser = { module = "com.github.terrakok:navigation3-browser", version.ref = "navigation3Browser" }
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-composeViewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
# Публикует klib'ы под linuxx64/linuxarm64/macosarm64 — проверено в Central, а не предположено.
# Серверной половины SDK здесь нет: её приносит kore-mcp через `api`, и `mcpSdk` обязан совпадать с
# той версией, на которой kore-mcp опубликован, — клиент и сервер говорят одним SDK.
mcp-client = { module = "io.modelcontextprotocol:kotlin-sdk-client", version.ref = "mcpSdk" }
# Интерфейс в терминале на рантайме Compose. Публикует klib'ы под наши нативные таргеты.
mosaic-runtime = { module = "com.jakewharton.mosaic:mosaic-runtime", version.ref = "mosaic" }

[plugins]
koreBuild = { id = "io.github.youndie.kore.build", version.ref = "kore" }
sborkaKmp = { id = "io.github.youndie.sborka.kmp", version.ref = "sborka" }
sborkaParity = { id = "io.github.youndie.sborka.parity", version.ref = "sborka" }
sborkaJvm = { id = "io.github.youndie.sborka.jvm", version.ref = "sborka" }
sborkaLint = { id = "io.github.youndie.sborka.lint", version.ref = "sborka" }
sborkaPublish = { id = "io.github.youndie.sborka.publish", version.ref = "sborka" }
ktlintPlugin = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
