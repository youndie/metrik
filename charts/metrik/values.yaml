image:
  repository: ghcr.io/youndie/metrik
  tag: latest
  # Always, а не IfNotPresent: тег latest мутабельный, и с IfNotPresent узел навсегда
  # остаётся на первом скачанном образе.
  pullPolicy: Always


# Ingest-key инсталляции. Один на всю установку; сервер не стартует без него.
# В проде подставляется из существующего секрета: existingSecret + secretKey.
ingestKey: ""
existingSecret: ""
secretKey: ingest-key

# Уведомления в Telegram. Пусто — доставки нет: сервер поднимает notifier-заглушку, и «Отправить
# тестовое» на экране алертов честно ответит «не доставлено».
telegram:
  # Токен бота. Едет в под через Secret, а не значением в спеке пода: бот умеет писать в ваш чат.
  # В проде подставляется из существующего секрета: existingSecret + secretKey.
  token: ""
  existingSecret: ""
  secretKey: telegram-token
  # Идентификатор чата — не секрет, поэтому обычная переменная. У групп он отрицательный.
  chatId: ""

# Доступ для агентов по MCP. Пусто — эндпоинта нет вовсе: ни секрета, ни переменной, ни обхода
# ingress. Отсутствие настройки обязано давать закрытое состояние, а не открытое: маршрут /mcp
# идёт мимо oauth2-proxy и защищён только этим токеном.
mcp:
  token: ""
  existingSecret: ""
  secretKey: mcp-token
  # Хосты, с которых принимается запрос, — защита от DNS rebinding. Пусто при traefik.enabled
  # означает traefik.hostname; выключить проверку целиком можно только явно.
  allowedHosts: ""

# Браузерный дашборд. Выключается для инсталляций, которым хватает клиента в терминале и MCP:
# страница разом тянет html, wasm, шрифты и пачку вызовов API, и именно эта веерность растит пул
# потоков сервера, а с ним и полку потребления памяти (M-99).
#
# Выключение снимает только отдачу статики — API и алерты остаются, дашборд просто не отвечает.
web:
  enabled: true

# Пусто — админ любой, кто прошёл reverse proxy.
admins: ""

retentionHours: 48

# Имя, под которым metrik мониторит сам себя. Пусто — самонаблюдение выключено.
selfService: metrik-server

persistence:
  size: 5Gi
  storageClass: ""

# Вариант 1: обычный Ingress.
ingress:
  enabled: false
  className: ""
  host: metrik.example.com
  annotations: {}

# Вариант 2: Traefik IngressRoute (контур с oauth2-proxy).
# Аутентификации у metrik нет — authMiddleware обязателен, иначе дашборд открыт всем.
traefik:
  enabled: false
  hostname: metrik.example.com
  certResolver: cloudflare
  authMiddleware:
    name: ""
  middlewares: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
