apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-metrik
spec:
  replicas: 1
  # База — файл на диске: второй экземпляр писал бы в неё же. Обновление только Recreate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-metrik
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-metrik
    spec:
      # ЧИСЛО, ПРОТИВ КОТОРОГО ПРОВЕРЯЕТСЯ ПЛАН ОСТАНОВКИ. `DEADLINES` в `Application.kt`
      # складывается в 21 секунду и объявляет 30 своим бюджетом; настоящий grace period процессу
      # не сообщает ни одна платформа, поэтому это одно число в двух местах. Опустишь здесь —
      # процесс убьют посреди слива, и проверка kore промолчит, потому что ей сказали 30.
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: ingest
              containerPort: 9999
              protocol: UDP
          env:
            - name: METRIK_INGEST_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default (printf "%s-metrik" .Release.Name) }}
                  key: {{ .Values.secretKey }}
            - name: METRIK_RETENTION_HOURS
              value: {{ .Values.retentionHours | quote }}
            - name: METRIK_ADMINS
              value: {{ .Values.admins | quote }}
            {{- with .Values.selfService }}
            # Сервер мониторит сам себя тем же агентом: мониторинг, которого не видно, бесполезен.
            - name: METRIK_SELF_SERVICE
              value: {{ . | quote }}
            {{- end }}
            {{- if or .Values.telegram.token .Values.telegram.existingSecret }}
            # Токен бота — через Secret, а не значением в спеке: бот умеет писать в ваш чат, и
            # `kubectl get deploy -o yaml` не должен его показывать.
            - name: METRIK_TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.telegram.existingSecret | default (printf "%s-metrik" .Release.Name) }}
                  key: {{ .Values.telegram.secretKey }}
            {{- end }}
            {{- with .Values.telegram.chatId }}
            - name: METRIK_TELEGRAM_CHAT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- if not .Values.web.enabled }}
            # Пустой корень выключает отдачу дашборда: образ несёт статику всегда, а отдаёт её
            # только тот, кому она нужна. API и алерты этим не затрагиваются.
            - name: METRIK_WEB_ROOT
              value: ""
            {{- end }}
            {{- if or .Values.mcp.token .Values.mcp.existingSecret }}
            # Токен MCP — единственное, что защищает /mcp: этот маршрут идёт мимо oauth2-proxy.
            - name: METRIK_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.existingSecret | default (printf "%s-metrik" .Release.Name) }}
                  key: {{ .Values.mcp.secretKey }}
            # Защита от DNS rebinding. При traefik.enabled хост известен из чарта, и оставлять
            # проверку выключенной по умолчанию незачем: этот класс ошибок локально не ловится —
            # на машине разработчика хост всегда и есть localhost.
            - name: METRIK_MCP_ALLOWED_HOSTS
              value: {{ .Values.mcp.allowedHosts | default (ternary .Values.traefik.hostname "" .Values.traefik.enabled) | quote }}
            {{- end }}
          # ТРИ ПРОБЫ, ТРИ РАЗНЫХ ВОПРОСА. Обе пробы стояли на `/health`, а тот пинговал базу:
          # проба живости падала от недоступного хранилища и перезапускала под — а хранилище
          # недоступно всем подам сразу, так что перезапуск растягивал восстановление вместо того,
          # чтобы его ускорить. И одновременно readiness не могла упасть ни по какой другой
          # причине, включая остановку.
          #
          # `failureThreshold: 60` при `periodSeconds: 1` вместо длинного `initialDelaySeconds`:
          # под входит в строй, когда готов, а не в назначенный час. Миграции идут до того, как
          # движок начнёт отвечать, — минута отведена им.
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 1
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            failureThreshold: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-metrik-data
