apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-metrik
spec:
  replicas: 1
  # База — файл на диске: второй экземпляр писал бы в неё же. Обновление только Recreate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-metrik
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-metrik
    spec:
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: ingest
              containerPort: 9999
              protocol: UDP
          env:
            - name: METRIK_INGEST_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default (printf "%s-metrik" .Release.Name) }}
                  key: {{ .Values.secretKey }}
            - name: METRIK_RETENTION_HOURS
              value: {{ .Values.retentionHours | quote }}
            - name: METRIK_ADMINS
              value: {{ .Values.admins | quote }}
            {{- with .Values.selfService }}
            # Сервер мониторит сам себя тем же агентом: мониторинг, которого не видно, бесполезен.
            - name: METRIK_SELF_SERVICE
              value: {{ . | quote }}
            {{- end }}
            {{- if or .Values.telegram.token .Values.telegram.existingSecret }}
            # Токен бота — через Secret, а не значением в спеке: бот умеет писать в ваш чат, и
            # `kubectl get deploy -o yaml` не должен его показывать.
            - name: METRIK_TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.telegram.existingSecret | default (printf "%s-metrik" .Release.Name) }}
                  key: {{ .Values.telegram.secretKey }}
            {{- end }}
            {{- with .Values.telegram.chatId }}
            - name: METRIK_TELEGRAM_CHAT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- if or .Values.mcp.token .Values.mcp.existingSecret }}
            # Токен MCP — единственное, что защищает /mcp: этот маршрут идёт мимо oauth2-proxy.
            - name: METRIK_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.existingSecret | default (printf "%s-metrik" .Release.Name) }}
                  key: {{ .Values.mcp.secretKey }}
            # Защита от DNS rebinding. При traefik.enabled хост известен из чарта, и оставлять
            # проверку выключенной по умолчанию незачем: этот класс ошибок локально не ловится —
            # на машине разработчика хост всегда и есть localhost.
            - name: METRIK_MCP_ALLOWED_HOSTS
              value: {{ .Values.mcp.allowedHosts | default (ternary .Values.traefik.hostname "" .Values.traefik.enabled) | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-metrik-data
