{{- $ownIngestKey := and .Values.ingestKey (not .Values.existingSecret) }}
{{- $ownTelegramToken := and .Values.telegram.token (not .Values.telegram.existingSecret) }}
{{- if or $ownIngestKey $ownTelegramToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-metrik
type: Opaque
stringData:
  {{- if $ownIngestKey }}
  {{ .Values.secretKey }}: {{ .Values.ingestKey | quote }}
  {{- end }}
  {{- if $ownTelegramToken }}
  {{ .Values.telegram.secretKey }}: {{ .Values.telegram.token | quote }}
  {{- end }}
{{- end }}
