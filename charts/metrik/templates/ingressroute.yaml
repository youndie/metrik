{{- if .Values.traefik.enabled }}
# Контур с Traefik + oauth2-proxy: аутентификация живёт в middleware, metrik доверяет
# заголовкам X-Auth-Request-User / X-Auth-Request-Email. Своего логина у него нет,
# поэтому маршрут БЕЗ auth-middleware открыл бы дашборд всем.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-redirect-to-https
  namespace: {{ .Release.Namespace }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-metrik
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`{{ .Values.traefik.hostname }}`)
      kind: Rule
      middlewares:
        - name: {{ .Release.Name }}-redirect-to-https
      services:
        - name: {{ .Release.Name }}-metrik
          port: 80
      priority: 1

    # API — приоритет выше, чем у статики, иначе /api уедет в nginx.
    - match: Host(`{{ .Values.traefik.hostname }}`) && PathPrefix(`/api`)
      kind: Rule
      middlewares:
        - name: {{ .Values.traefik.authMiddleware.name }}
      {{- range .Values.traefik.middlewares }}
        - name: {{ .name }}
      {{- end }}
      services:
        - name: {{ .Release.Name }}-metrik
          port: 8080
      priority: 20

    - match: Host(`{{ .Values.traefik.hostname }}`)
      kind: Rule
      middlewares:
        - name: {{ .Values.traefik.authMiddleware.name }}
      {{- range .Values.traefik.middlewares }}
        - name: {{ .name }}
      {{- end }}
      services:
        - name: {{ .Release.Name }}-metrik
          port: 80
      priority: 10
  tls:
    certResolver: {{ .Values.traefik.certResolver | quote }}
{{- end }}
