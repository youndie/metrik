{{- if .Values.traefik.enabled }}
# Контур с Traefik + oauth2-proxy: аутентификация живёт в middleware, metrik доверяет
# заголовкам X-Auth-Request-User / X-Auth-Request-Email. Своего логина у него нет,
# поэтому маршрут БЕЗ auth-middleware открыл бы дашборд всем.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-redirect-to-https
  namespace: {{ .Release.Namespace }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-metrik
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`{{ .Values.traefik.hostname }}`)
      kind: Rule
      middlewares:
        - name: {{ .Release.Name }}-redirect-to-https
      services:
        - name: {{ .Release.Name }}-metrik
          port: 8080
      priority: 1

    - match: Host(`{{ .Values.traefik.hostname }}`)
      kind: Rule
      middlewares:
        - name: {{ .Values.traefik.authMiddleware.name }}
      {{- range .Values.traefik.middlewares }}
        - name: {{ .name }}
      {{- end }}
      services:
        - name: {{ .Release.Name }}-metrik
          port: 8080
      priority: 10
  tls:
    certResolver: {{ .Values.traefik.certResolver | quote }}
{{- if .Values.mcp.token }}
---
# Клиент MCP — машина: форму входа oauth2-proxy она пройти не может, и общий маршрут отдал бы ей
# страницу логина вместо ответа. Поэтому /mcp идёт мимо auth-middleware.
#
# Обход рендерится только когда токен задан: иначе он возник бы без той аутентификации, которую
# собой заменяет, и эндпоинт оказался бы открыт всем.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-metrik-mcp
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.traefik.hostname }}`) && PathPrefix(`/mcp`)
      kind: Rule
      services:
        - name: {{ .Release.Name }}-metrik
          port: 8080
      priority: 200
  tls:
    certResolver: {{ .Values.traefik.certResolver | quote }}
{{- end }}
{{- end }}
