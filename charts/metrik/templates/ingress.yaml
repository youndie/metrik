{{- if .Values.ingress.enabled }}
# Внимание: перед этим ingress обязан стоять reverse proxy с аутентификацией
# (oauth2-proxy / Traefik ForwardAuth / nginx auth_request). Своего логина у metrik нет.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-metrik
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-metrik
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-metrik
                port:
                  name: web
{{- end }}
