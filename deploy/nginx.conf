server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA: любой путь отдаёт оболочку, маршрутизация внутри приложения.
    #
    # Перепроверка по умолчанию: всё, что не адресуется хэшем содержимого (шрифты и прочие
    # compose-ресурсы), обязано спрашивать сервер, не изменилось ли оно.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Про Content-Type для .wasm заботиться не нужно: он есть в стандартном mime.types nginx
    # с 1.21. Блок `types { }` здесь был бы вреден — он заменяет унаследованную карту целиком,
    # и .js с .css поехали бы как application/octet-stream.

    # Кэширование задаётся явно, потому что без единого заголовка браузер кэширует по эвристике
    # (доля времени с последнего изменения по Last-Modified) и держит старую сборку часами. Это не
    # теория: после выкатки дашборд показывал старый код при уже новом сервере, и лечилось это
    # только ручным сбросом кэша.
    #
    # index.html и composeApp.js имеют постоянные имена, а содержимое меняется с каждой выкаткой —
    # им обязательна перепроверка. Стоит она один условный запрос: не изменилось — 304 без тела.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ \.js$ {
        add_header Cache-Control "no-cache";
    }

    # А вот .wasm адресуется хэшем содержимого: новая сборка — новое имя файла, старое имя всегда
    # означает ровно те же байты. Такое кэшируется бессрочно, и именно оно весит мегабайты.
    location ~ \.wasm$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types application/javascript application/wasm text/css application/json;
}
