server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA: любой путь отдаёт оболочку, маршрутизация внутри приложения.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # wasm обязателен с правильным Content-Type, иначе браузер не станет его исполнять.
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_types application/javascript application/wasm text/css application/json;
}
