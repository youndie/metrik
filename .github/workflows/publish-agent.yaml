name: Publish agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - agent/**
      - shared/**
      - .github/workflows/publish-agent.yaml

jobs:
  publish:
    # macOS host: it is the only runner that can build every target the agent declares
    # (jvm + linuxX64 + linuxArm64 + macosArm64). A Linux runner cannot produce the macos klib.
    runs-on: macos-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Publish
        # :shared is exposed through `api` from :agent, so both have to land in the repository.
        run: |
          ./gradlew :shared:publishAllPublicationsToWipRepository :agent:publishAllPublicationsToWipRepository --no-daemon
        env:
          # The head of the version, and it is also written in gradle.properties — the two move
          # together. This line used to be ORG_GRADLE_PROJECT_BUILD_NUMBER, a name nothing reads
          # since `libVersion()` was deleted, so every run here published the fallback
          # `0.1.0-SNAPSHOT` instead of a numbered version.
          ORG_GRADLE_PROJECT_VERSION: 0.2.${{ github.run_number }}
          ORG_GRADLE_PROJECT_REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          ORG_GRADLE_PROJECT_REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}
