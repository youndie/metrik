name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Кэш Kotlin/Native: LLVM и sysroot'ы весят сотни мегабайт и качаются один раз,
      # без кэша каждый прогон CI тратит на это несколько минут.
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # build включает ktlintCheck (через check) и тесты всех модулей.
      # macosArm64 на linux-раннере отключён — его гасит kotlin.native.ignoreDisabledTargets.
      - run: ./gradlew build --stacktrace

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/**
          retention-days: 7
